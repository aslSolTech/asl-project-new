services:
  # 1. Backend Service (Node.js + Express + BullMQ Workers)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payzones_backend
    restart: always
    ports:
      - '5000:5000'
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MYSQL_HOST=mariadb
      - MYSQL_PORT=3307
      - MYSQL_DBNAME=payzones_db
      - MYSQL_USER=payzones_user
      - MYSQL_PWD=payzones_password
      - MONGODB_URI=mongodb://mongodb:27017/payzones_logs
    depends_on:
      - redis
      - mariadb
      - mongodb
    networks:
      - payzones_net

  # 2. Redis (Local BullMQ Job Queue & Caching ke liye)
  redis:
    image: redis:8.2-alpine
    container_name: payzones_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - payzones_net

  # 3. MariaDB Database (MySQL Compatible Database)
  mariadb:
    image: mariadb:12.3
    container_name: payzones_mariadb
    restart: always
    ports:
      - '3307:3306'
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: payzones_db
      MARIADB_USER: payzones_user
      MARIADB_PASSWORD: payzones_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - payzones_net

  # 4. phpMyAdmin (MariaDB/MySQL Ko Browser me Manage karne ke liye GUI)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: payzones_phpmyadmin
    restart: always
    ports:
      - '8080:80'
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    depends_on:
      - mariadb
    networks:
      - payzones_net
  
  # 5. Nginx Reverse Proxy
  nginx:
    image: nginx:latest
    container_name: nginx_router
    restart: always
    ports:
      - "80:80" # Web traffic ke liye standard port
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - phpmyadmin
      - backend
    networks:
      - payzones_net

  # 6. MongoDB Database
  mongodb:
    image: mongo:8.0.13
    container_name: payzones_mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - payzones_net

  # 6. SonarQube (Code Quality & Vulnerability Scanner)
  # sonarqube:
  #   image: sonarqube:community
  #   container_name: payzones_sonarqube
  #   restart: always
  #   ports:
  #     - '9000:9000'
  #   volumes:
  #     - sonarqube_data:/opt/sonarqube/data
  #     - sonarqube_extensions:/opt/sonarqube/extensions
  #     - sonarqube_logs:/opt/sonarqube/logs
  #   networks:
  #     - payzones_net

# Persistent Data Storage Volumes
volumes:
  redis_data:
  mariadb_data:
  mongo_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

# Private Network
networks:
  payzones_net:
    driver: bridge
