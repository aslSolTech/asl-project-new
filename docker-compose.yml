services:
  # --- COMMON / DATABASE SERVICES (Runs in both dev & live profiles) ---

  # 1. Redis
  redis:
    image: redis:8.2-alpine
    container_name: payzones_redis
    profiles: ["dev", "live"]
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    env_file:
      - ./backend/.env
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - payzones_net

  # 2. MariaDB Database
  mariadb:
    image: mariadb:12.3
    container_name: payzones_mariadb
    profiles: ["dev", "live"]
    restart: always
    ports:
      - '3307:3306'
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: payzones_db
      MARIADB_USER: payzones_user
      MARIADB_PASSWORD: payzones_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - payzones_net

  # 3. phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: payzones_phpmyadmin
    profiles: ["dev", "live"]
    restart: always
    ports:
      - '8080:80'
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    depends_on:
      - mariadb
    networks:
      - payzones_net

  # 4. MongoDB Database
  mongodb:
    image: mongo:8.0.13
    container_name: payzones_mongodb
    profiles: ["dev", "live"]
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - payzones_net

  # --- BACKEND PROFILES ---

  # Backend Dev Profile (Hot-Reloading with Dockerfile.dev)
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: payzones_backend_dev
    profiles: ["dev"]
    restart: always
    ports:
      - '5000:5000'
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MYSQL_HOST=mariadb
      - MYSQL_PORT=3306
      - MYSQL_DBNAME=payzones_db
      - MYSQL_USER=payzones_user
      - MYSQL_PWD=payzones_password
      - MONGODB_URI=mongodb://mongodb:27017/payzones_logs
    depends_on:
      - redis
      - mariadb
      - mongodb
    networks:
      - payzones_net

  # Backend Live/Prod Profile (Builds and runs compiled dist/ index.js)
  backend-live:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payzones_backend_live
    profiles: ["live"]
    restart: always
    ports:
      - '5000:5000'
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MYSQL_HOST=mariadb
      - MYSQL_PORT=3306
      - MYSQL_DBNAME=payzones_db
      - MYSQL_USER=payzones_user
      - MYSQL_PWD=payzones_password
      - MONGODB_URI=mongodb://mongodb:27017/payzones_logs
    depends_on:
      - redis
      - mariadb
      - mongodb
    networks:
      - payzones_net

  # --- FRONTEND SERVICE ---

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: payzones_frontend
    profiles: ["dev", "live"]
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - payzones_net

# Persistent Data Storage Volumes
volumes:
  redis_data:
  mariadb_data:
  mongo_data:

# Private Network
networks:
  payzones_net:
    driver: bridge
